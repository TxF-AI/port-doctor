<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PortDoctor</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="led" id="led"></span>PortDoctor <small>v0.5.1</small></div>
        <input id="filter" type="search" data-i18n-ph="filter_ph" autocomplete="off" spellcheck="false" />
        <label class="chk"><input id="devOnly" type="checkbox" /> <span data-i18n="dev_only"></span></label>
        <label class="chk" data-i18n-title="simple_title"><input id="simple" type="checkbox" /> <span data-i18n="simple_view"></span></label>
        <button id="refresh" class="btn" data-i18n="refresh" data-i18n-title="refresh_title"></button>
        <select id="lang" class="btn" data-i18n-title="language" aria-label="Language">
          <option value="fr">FR</option>
          <option value="en">EN</option>
        </select>
      </header>

      <section class="stats" id="stats"></section>
      <div id="banner" class="banner" hidden></div>

      <main class="tablewrap">
        <table>
          <thead>
            <tr>
              <th data-k="port" data-i18n="col_port"></th>
              <th data-k="proto" class="adv" data-i18n="col_proto"></th>
              <th data-k="process_name"><span class="adv" data-i18n="col_process"></span><span class="simple-only" data-i18n="col_what"></span></th>
              <th data-k="pid" class="num adv" data-i18n="col_pid"></th>
              <th data-k="memory_bytes" class="num adv" data-i18n="col_memory"></th>
              <th data-k="source" class="adv" data-i18n="col_source"></th>
              <th data-i18n="col_action"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="empty" class="empty" data-i18n="empty" hidden></p>
      </main>

      <footer class="foot"><span id="status">…</span></footer>
    </div>

    <div id="toasts" aria-live="polite"></div>

    <dialog id="treeDlg">
      <h2 data-i18n="dlg_title"></h2>
      <p id="treeIntro" class="dim"></p>
      <ul id="treeList" class="tree"></ul>
      <label class="chk" id="parentsRow"><input id="withParents" type="checkbox" checked /> <span data-i18n="dlg_parents"></span></label>
      <p class="dim small" data-i18n="dlg_note"></p>
      <div class="actions">
        <button id="treeCancel" class="btn" type="button" data-i18n="cancel"></button>
        <button id="treeOk" class="kill armed" type="button" data-i18n="stop_tree"></button>
      </div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
