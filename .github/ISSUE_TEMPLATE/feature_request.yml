name: Feature request / Proposer une fonctionnalité
description: An idea to improve PortDoctor (English or French).
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Which concrete situation is a problem for you today?
      placeholder: "My dev server starts 3 processes and I have to ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you imagine it working (interface, behavior)?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Current workarounds (`netstat`, `taskkill`…), other tools.
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - List and filters
        - Kill / Smart Kill
        - WSL2 / Docker
        - Hyper-V / excluded ranges
        - System tray
        - Other
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I understand that PortDoctor must keep protecting system processes and ask for confirmation before any stop.
