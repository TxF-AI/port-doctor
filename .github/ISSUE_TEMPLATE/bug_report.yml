name: Bug report / Signaler un bug
description: Quelque chose ne marche pas comme prévu dans PortDoctor.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de signaler le problème. **Ne colle pas de données personnelles** (nom d'utilisateur Windows, chemins privés) dans les logs ou les captures.
  - type: input
    id: app-version
    attributes:
      label: Version de PortDoctor
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Version de Windows
      description: "Commande `winver`."
      placeholder: "Windows 11 23H2 (build 22631)"
    validations:
      required: true
  - type: dropdown
    id: privileges
    attributes:
      label: Lancé en administrateur ?
      description: Arrêter un processus lancé en administrateur demande les mêmes droits.
      options:
        - Non
        - Oui
        - Je ne sais pas
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Zone concernée
      options:
        - Liste des ports (TCP/UDP)
        - Kill / Smart Kill (arbre de processus)
        - Détection WSL2 / Docker
        - Plages exclues Hyper-V
        - System Tray / fenêtre
        - Autre
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Lancer `npm run dev` (port 3000)
        2. Cliquer sur Kill dans PortDoctor
        3. ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexte WSL2 / Docker / Hyper-V (si pertinent)
      description: "Sortie utile : `wsl.exe -l -v`, `netsh interface ipv4 show excludedportrange protocol=tcp`."
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Logs, message d'erreur, captures d'écran
