name: Bug report / Signaler un bug
description: Something does not work as expected in PortDoctor (English or French).
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting the problem. **Do not paste personal data** (Windows user name, private paths) in logs or screenshots.
  - type: input
    id: app-version
    attributes:
      label: PortDoctor version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Windows version
      description: "Run `winver`."
      placeholder: "Windows 11 23H2 (build 22631)"
    validations:
      required: true
  - type: dropdown
    id: privileges
    attributes:
      label: Run as administrator?
      description: Stopping a process started as administrator needs the same rights.
      options:
        - "No"
        - "Yes"
        - I don't know
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Port list (TCP/UDP)
        - Kill / Smart Kill (process tree)
        - WSL2 / Docker detection
        - Hyper-V excluded ranges
        - System tray / window
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm run dev` (port 3000)
        2. Click Kill in PortDoctor
        3. ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: WSL2 / Docker / Hyper-V context (if relevant)
      description: "Useful output: `wsl.exe -l -v`, `netsh interface ipv4 show excludedportrange protocol=tcp`."
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Logs, error message, screenshots
