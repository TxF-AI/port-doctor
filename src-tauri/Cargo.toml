[package]
name = "port-doctor"
version = "0.2.0"
description = "Libère les ports bloqués et inspecte WSL2 / Hyper-V"
authors = ["TxF-AI"]
license = "MIT"
edition = "2024"

[lib]
name = "port_doctor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
netstat2 = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
